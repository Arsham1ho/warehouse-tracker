services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 2s
      retries: 15

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    command: mosquitto -c /mosquitto-no-auth.conf
